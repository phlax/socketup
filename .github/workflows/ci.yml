name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all --target x86_64-unknown-linux-gnu

  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - name: Add targets
        run: rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
      - name: Build static x86_64
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target x86_64-unknown-linux-gnu --bin socketup
      - name: Verify static linkage
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/socketup
          ldd "$BIN" 2>&1 | tee /tmp/ldd.txt
          grep -Eq "not a dynamic executable|statically linked" /tmp/ldd.txt
          if readelf -d "$BIN" | grep -E "(NEEDED|INTERP)"; then
            echo "binary contains dynamic dependencies"
            exit 1
          fi
      - name: Size check
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/socketup
          ls -lh "$BIN"
          test "$(stat -c%s "$BIN")" -lt 2000000
      - name: Build static aarch64
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target aarch64-unknown-linux-gnu --bin socketup
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: socketup-x86_64
          path: target/x86_64-unknown-linux-gnu/release/socketup

  distroless-integration:
    runs-on: ubuntu-latest
    needs: build-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Download probe artifact
        uses: actions/download-artifact@v4
        with:
          name: socketup-x86_64
          path: ./artifacts
      - name: Prepare binaries
        run: |
          chmod +x ./artifacts/socketup
          cp ./artifacts/socketup ./socketup
      - name: Build static test app
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --bin socketup-testapp
          cp target/x86_64-unknown-linux-gnu/release/socketup-testapp ./socketup-testapp
      - name: Build images
        run: |
          docker build -f docker/Dockerfile.test-app -t socketup-testapp:ci .
          docker build -f docker/Dockerfile.probe -t socketup-probe:ci .
      - name: Run assertions
        run: |
          set -euo pipefail
          trap 'docker logs socketup-testapp || true' EXIT
          docker run -d --name socketup-testapp socketup-testapp:ci

          docker run --rm --network container:socketup-testapp socketup-probe:ci check admin
          docker run --rm --network container:socketup-testapp socketup-probe:ci check ingress

          if docker run --rm --network container:socketup-testapp socketup-probe:ci check missing; then
            echo "expected missing check to fail"
            exit 1
          else
            rc=$?
            test "$rc" -eq 6
          fi

          docker stop socketup-testapp

          set +e
          docker run --rm socketup-probe:ci check admin
          rc=$?
          set -e
          if [ "$rc" -ne 1 ] && [ "$rc" -ne 7 ]; then
            echo "expected exit code 1 or 7, got $rc"
            exit 1
          fi

  distroless-nonroot-integration:
    runs-on: ubuntu-latest
    needs: build-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: socketup-x86_64
          path: ./artifacts
      - name: Prepare probe and test app binaries
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          chmod +x ./artifacts/socketup
          cp ./artifacts/socketup ./socketup
          cargo build --release --target x86_64-unknown-linux-gnu --bin socketup-testapp
          cp target/x86_64-unknown-linux-gnu/release/socketup-testapp ./socketup-testapp
      - name: Build images
        run: |
          docker build -f docker/Dockerfile.test-app -t socketup-testapp:ci .
          docker build -f docker/Dockerfile.probe -t socketup-probe:ci .
          cat > /tmp/Dockerfile.probe-nonroot <<'DOCKER'
          FROM socketup-probe:ci AS scratch-probe
          FROM gcr.io/distroless/base-nossl-debian12:nonroot
          COPY --from=scratch-probe /socketup /socketup
          COPY docker/socketup.yaml /etc/socketup/socketup.yaml
          USER nonroot:nonroot
          ENTRYPOINT ["/socketup"]
          DOCKER
          docker build -f /tmp/Dockerfile.probe-nonroot -t socketup-probe-nonroot:ci .
      - name: Verify nonroot execution
        run: |
          set -euo pipefail
          trap 'docker logs socketup-testapp || true' EXIT
          docker run -d --name socketup-testapp socketup-testapp:ci
          docker run --rm --network container:socketup-testapp socketup-probe-nonroot:ci check admin
